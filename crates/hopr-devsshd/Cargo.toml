[package]
name = "hopr-devsshd"
description = "Dev-only SSH server on 127.0.0.1 that serves a real local shell (for testing Hopr without Docker)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
portable-pty = "0.9"
rand = "0.10"
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio.workspace = true
hopr-sftp = { path = "../hopr-sftp", features = ["server"] }
russh-sftp = "3.0.1"

[lints]
workspace = true
