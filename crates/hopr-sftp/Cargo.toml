[package]
name = "hopr-sftp"
description = "Hopr SFTP: browsing, file operations and resumable transfers over the SSH route"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# A local-filesystem SFTP server, for tests and hopr-devsshd. Never part of the app.
server = []

[dependencies]
hopr-core.workspace = true
hopr-ssh = { path = "../hopr-ssh" }
russh-sftp = "3.0.1"
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true

[dev-dependencies]
data-encoding = "2"
hopr-sftp = { path = ".", features = ["server"] }
rand = "0.10"
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
secrecy = "0.10"
tokio = { workspace = true, features = ["test-util", "fs"] }

[lints]
workspace = true
