<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Hopr favicon: the small cut of the app icon (src-tauri/icons/source/hopr-icon-small.svg). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c20" />
      <stop offset="1" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="arc" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="780" y2="0">
      <stop offset="0" stop-color="#f4f5f7" stop-opacity="0.55" />
      <stop offset="1" stop-color="#f4f5f7" />
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="992" height="992" rx="220" fill="url(#tile)" />
  <path d="M200 790 C 270 250, 690 170, 770 610" fill="none" stroke="url(#arc)" stroke-width="124" stroke-linecap="round" />
  <rect x="600" y="700" width="300" height="128" rx="64" fill="#7cb7ff" />
</svg>
