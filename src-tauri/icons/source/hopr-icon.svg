<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Hopr app icon (48px and up): an arc that hops and lands on a cursor. Black tile, near-white
       arc, Hopr blue on the cursor and the glow. Master for scripts/icons.mjs; the small cut is
       hopr-icon-small.svg and the in-app mark is src/lib/icons/HoprMark.svelte. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18181b" />
      <stop offset="1" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.2" r="0.64">
      <stop offset="0" stop-color="#7cb7ff" stop-opacity="0.42" />
      <stop offset="1" stop-color="#7cb7ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="arc" gradientUnits="userSpaceOnUse" x1="220" y1="0" x2="780" y2="0">
      <stop offset="0" stop-color="#f4f5f7" stop-opacity="0.08" />
      <stop offset="0.45" stop-color="#f4f5f7" stop-opacity="0.72" />
      <stop offset="1" stop-color="#f4f5f7" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>
  <g transform="translate(32 32) scale(0.9375)">
    <rect width="1024" height="1024" rx="232" fill="url(#tile)" />
    <rect width="1024" height="1024" rx="232" fill="url(#glow)" />
    <ellipse cx="760" cy="752" rx="190" ry="54" fill="#7cb7ff" opacity="0.5" filter="url(#soft)" />
    <path d="M226 760 C 300 300, 650 210, 748 642" fill="none" stroke="url(#arc)" stroke-width="84" stroke-linecap="round" />
    <rect x="648" y="708" width="226" height="88" rx="44" fill="#7cb7ff" />
    <path d="M0 232 A232 232 0 0 1 232 0 H792 A232 232 0 0 1 1024 232 V400 C 720 470, 330 330, 0 450 Z" fill="url(#sheen)" />
    <rect x="3" y="3" width="1018" height="1018" rx="229" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="6" />
  </g>
</svg>
