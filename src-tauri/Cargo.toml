[package]
name = "hopr"
description = "Hopr desktop app (thin Tauri glue)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "hopr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# Test binaries can't load the webview DLLs on Windows (no app manifest); logic lives in crates/.
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hopr-core.workspace = true
hopr-ssh = { path = "../crates/hopr-ssh" }
serde.workspace = true
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }
serde_json.workspace = true
specta.workspace = true
tauri = { version = "2", features = [] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"

[lints]
workspace = true

[[bin]]
name = "hopr"
path = "src/main.rs"
test = false
